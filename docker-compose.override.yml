services:
  # This block overrides the base 'api-server' definition to add network links
  api-server: 
    environment:
    - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    networks:
      # Ensure it is on the networks defined at the bottom of the file
      - dataplatform_net
      - credit-card-fraud-detection_a176c0_airflow

  postgres:
    image: postgres:17
    restart: on-failure
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - dataplatform_net
      - credit-card-fraud-detection_a176c0_airflow

  pgadmin:
    image: dpage/pgadmin4
    restart: on-failure
    env_file:
      - .env
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - dataplatform_net
      - credit-card-fraud-detection_a176c0_airflow
    depends_on:
      - postgres

  metabase:
    image: metabase/metabase:latest
    restart: always
    env_file:
      - .env
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${POSTGRES_DB}
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: postgres
      MB_ENCRYPTION_SECRET_KEY: ${MB_ENCRYPTION_SECRET_KEY}
      MB_SITE_URL: ${MB_SITE_URL}
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    networks:
      - dataplatform_net
      - credit-card-fraud-detection_a176c0_airflow

  minio:
    image: minio/minio
    restart: always
    env_file:
      - .env
    environment:
      - MINIO_ROOT_USER=${MINIO_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}
      # Kafka notification target
      - MINIO_NOTIFY_KAFKA_ENABLE_primary=on
      - MINIO_NOTIFY_KAFKA_BROKERS_primary=${KAFKA_BROKER}
      - MINIO_NOTIFY_KAFKA_TOPIC_primary=${MINIO_KAFKA_TOPIC}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # MinIO Console
    volumes:
      - minio-data:/data
    networks:
      - dataplatform_net
      - credit-card-fraud-detection_a176c0_airflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      - kafka

  mc:
    image: minio/mc
    restart: on-failure
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set localminio http://minio:9000 ${MINIO_USER} ${MINIO_PASSWORD} &&
        mc mb --ignore-existing localminio/${MINIO_BUCKET_RAW} &&
        mc mb --ignore-existing localminio/${MINIO_BUCKET_STAGING} &&
        mc mb --ignore-existing localminio/${MINIO_BUCKET_ARCHIVE} &&
        mc event add localminio/${MINIO_BUCKET_RAW} arn:minio:sqs::primary:kafka --event put --ignore-existing &&
        tail -f /dev/null
      "
    networks:
      - dataplatform_net
      - credit-card-fraud-detection_a176c0_airflow

  kafka:
    image: bitnami/kafka:3.7
    restart: always
    env_file:
      - .env
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://${KAFKA_BROKER}
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
    networks:
      - dataplatform_net
      - credit-card-fraud-detection_a176c0_airflow


  # Asset Event Service - Bridges MinIO events to Airflow (UPDATED FOR DYNAMIC JWT)
  asset-event-service:
    image: python:3.11-slim
    container_name: creditcard-asset-event-service # Simplified name
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    environment:
      - KAFKA_BROKER_HOST=kafka:9092
      - AIRFLOW_URL_HOST=http://api-server:8080 
      - MINIO_ENDPOINT_HOST=http://minio:9000
      
      # Airflow credentials are needed by the token generator script
      - AIRFLOW_USERNAME=${AIRFLOW_USERNAME}
      - AIRFLOW_PASSWORD=${AIRFLOW_PASSWORD}

    volumes:
      # CRITICAL FIX: Mount the dynamic entrypoint script
      - ./entrypoint.sh:/entrypoint.sh 
      # Mount the entire src directory (contains minio_asset_service.py and token_generator.py)
      - ./src:/app/src 

    command: >
      /bin/bash -c "
        echo ' Installing dependencies (including JWT libraries)...' &&
        # Install the required Python packages
        pip install --no-cache-dir kafka-python==2.0.2 requests==2.31.0 PyJWT cryptography &&
        echo ' Starting dynamic entrypoint...' &&
        # Execute the shell script that generates the token and starts the main service
        /entrypoint.sh
      "
    depends_on:
        # Use dictionary format when including conditions or mixing with simple service names
        api-server:
          condition: service_started
        kafka:
          condition: service_started
        minio:
          condition: service_started
    networks:
      - dataplatform_net
      - credit-card-fraud-detection_a176c0_airflow
    healthcheck:
      test: ["CMD", "python", "-c", "import kafka, requests; print('Health OK')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
  pgadmin-data:
  minio-data:

networks:
  dataplatform_net:
    driver: bridge
  credit-card-fraud-detection_a176c0_airflow:
    driver: bridge