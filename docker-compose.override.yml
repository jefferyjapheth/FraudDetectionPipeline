# Data Platform Stack
# Includes Airflow API, Postgres, Metabase, MinIO, Kafka, and the Asset Event Service.
services:


  # Airflow API Server
  # Extends the base Airflow service with network linkage for platform integration.
  api-server:
    environment:
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    networks:
      - dataplatform_net
      - credit-card-fraud-detection_a176c0_airflow


  # PostgreSQL - Core database for Airflow, Metabase, and platform services.
  postgres:
    image: postgres:17
    restart: on-failure
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d  # <-- ADD THIS LINE
    networks:
      - dataplatform_net
      - credit-card-fraud-detection_a176c0_airflow


  # pgAdmin - Web-based management console for PostgreSQL.
  pgadmin:
    image: dpage/pgadmin4
    restart: on-failure
    env_file:
      - .env
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - dataplatform_net
      - credit-card-fraud-detection_a176c0_airflow

 
  # Metabase - Business intelligence and data visualization tool.
  metabase:
    image: metabase/metabase:latest
    restart: always
    env_file:
      - .env
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${POSTGRES_DB}
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: postgres
      MB_ENCRYPTION_SECRET_KEY: ${MB_ENCRYPTION_SECRET_KEY}
      MB_SITE_URL: ${MB_SITE_URL}
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    networks:
      - dataplatform_net
      - credit-card-fraud-detection_a176c0_airflow


  # MinIO - Object storage compatible with AWS S3.
  # Configured to emit Kafka notifications on new uploads.
  minio:
    image: minio/minio
    restart: always
    env_file:
      - .env
    environment:
      - MINIO_ROOT_USER=${MINIO_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}
      - MINIO_NOTIFY_KAFKA_ENABLE_primary=on
      - MINIO_NOTIFY_KAFKA_BROKERS_primary=${KAFKA_BROKER}
      - MINIO_NOTIFY_KAFKA_TOPIC_primary=${MINIO_KAFKA_TOPIC}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API endpoint
      - "9001:9001" # Web console
    volumes:
      - minio-data:/data
    depends_on:
      - kafka
    networks:
      - dataplatform_net
      - credit-card-fraud-detection_a176c0_airflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  # MinIO Client (mc) - Initializes buckets and Kafka notifications.
  mc:
    image: minio/mc
    restart: on-failure
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set localminio http://minio:9000 ${MINIO_USER} ${MINIO_PASSWORD} &&
        mc mb --ignore-existing localminio/${MINIO_BUCKET_RAW} &&
        mc mb --ignore-existing localminio/${MINIO_BUCKET_MASTER_DATA} &&
        mc mb --ignore-existing localminio/${MINIO_BUCKET_ARCHIVE} &&
        mc event add localminio/${MINIO_BUCKET_RAW} arn:minio:sqs::primary:kafka --event put --ignore-existing &&
        tail -f /dev/null
      "
    networks:
      - dataplatform_net
      - credit-card-fraud-detection_a176c0_airflow


  kafka:
    image: confluentinc/cp-kafka:latest
    hostname: kafka
    restart: always
    env_file:
      - .env
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      # --- Core KRaft settings ---
      KAFKA_KRAFT_MODE: "true"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_NODE_ID: ${KAFKA_CFG_NODE_ID:-0}
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "${KAFKA_CFG_CONTROLLER_QUORUM_VOTERS:-0@kafka:9093}"

      # --- Networking ---
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://${KAFKA_BROKER:-kafka:9092}"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      # --- Optional defaults & tuning ---
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "Mk3OEYBSD34fcwNTJENDM2Qk"

    networks:
      - dataplatform_net
      - credit-card-fraud-detection_a176c0_airflow



  # Asset Event Service - Consumes MinIO events from Kafka and triggers Airflow asset updates.
  # Includes dynamic JWT handling for Airflow authentication.
  asset-event-service:
    image: python:3.11-slim
    container_name: creditcard-asset-event-service
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    environment:
      - KAFKA_BROKER_HOST=kafka:9092
      - AIRFLOW_URL_HOST=http://api-server:8080
      - MINIO_ENDPOINT_HOST=http://minio:9000
      - AIRFLOW_USERNAME=${AIRFLOW_USERNAME}
      - AIRFLOW_PASSWORD=${AIRFLOW_PASSWORD}
    volumes:
      - ./entrypoint.sh:/entrypoint.sh
      - ./src:/app/src
    command: >
      /bin/bash -c "
        echo 'Installing dependencies...' &&
        pip install --no-cache-dir kafka-python==2.0.2 requests==2.31.0 PyJWT cryptography &&
        echo 'Launching dynamic entrypoint...' &&
        /entrypoint.sh
      "
    depends_on:
      api-server:
        condition: service_started
      kafka:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - dataplatform_net
      - credit-card-fraud-detection_a176c0_airflow
    healthcheck:
      test: ["CMD", "python", "-c", "import kafka, requests; print('Health OK')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


# Volumes
volumes:
  postgres-data:
  pgadmin-data:
  minio-data:


# Networks
networks:
  dataplatform_net:
    driver: bridge
  credit-card-fraud-detection_a176c0_airflow:
    driver: bridge
